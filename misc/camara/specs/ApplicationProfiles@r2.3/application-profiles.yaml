openapi: 3.0.3
info:
  title: Connectivity Insights - Application Profiles
  x-camara-commonalities: 0.9.0
  version: 0.6.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Application profiles allow developers to specify all relevant information about their application for both network and compute resource
    requirements, supporting CAMARA APIs and network decision making.

    This API enables defining, reading, and managing application requirements, including:
    - Network quality thresholds (latency, jitter, loss, throughput)
    - Compute resource thresholds (CPU, GPU, memory, storage)

    The information captured as part of application profiles can be used in different usecases for decision making. Please refer connectivity insights and session insights for more details as a reference to see how the information in application profiles is used for decision making.
    The scope will expand as new requirements from CAMARA APIs emerge.

    ## Errors

    If the authentication token is not valid, a `401 UNAUTHENTICATED` error is
    returned.

    Any more general service failures will result in an error in the `5xx` range
    with an explanation.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->
servers:
  - url: '{apiRoot}/application-profiles/v0.6'
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: Application Profiles
    description: |
      Operations to define, read and manage an application's thresholds
      for network quality (latency, jitter, loss, throughput) and compute
      resources (CPU, GPU, memory, storage)
externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/ApplicationProfiles
paths:
  /application-profiles:
    post:
      security:
        - openId:
            - application-profiles:create
      tags:
        - Application Profiles
      summary: Create an Application Profile
      description: |
        Define the network quality and compute resource thresholds an
        application requires for an optimal end user experience.
      operationId: createApplicationProfile
      parameters:
        - $ref: '#/components/parameters/x-correlator'
      requestBody:
        description: Network quality and compute resource thresholds of the application
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationProfileRequest'
        required: true
      responses:
        '201':
          description: Created
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationProfile'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
  /application-profiles/{applicationProfileId}:
    patch:
      security:
        - openId:
            - application-profiles:update
      tags:
        - Application Profiles
      summary: Update an Application Profile
      description: |
        Replace the complete set of network quality and compute resource
        thresholds of an existing application profile with the set provided
        in the request body. The application profile is identified only by
        the `applicationProfileId` path parameter; the request body does not
        carry an identifier.
      operationId: updateApplicationProfile
      parameters:
        - name: applicationProfileId
          in: path
          description: Identifier for the Application Profile
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            maxLength: 36
        - $ref: '#/components/parameters/x-correlator'
      requestBody:
        description: |
          New set of network quality and compute resource thresholds for the
          application profile
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationProfileRequest'
        required: true
      responses:
        '200':
          description: 200 OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationProfile'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
    get:
      security:
        - openId:
            - application-profiles:read
      tags:
        - Application Profiles
      summary: Get an Application Profile
      description: Read an Application Profile
      operationId: getApplicationProfile
      parameters:
        - name: applicationProfileId
          in: path
          description: Identifier for the Application Profile
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            maxLength: 36
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '200':
          description: OK
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationProfile'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
    delete:
      security:
        - openId:
            - application-profiles:delete
      tags:
        - Application Profiles
      summary: Delete an Application Profile
      description: Delete an application profile
      operationId: deleteApplicationProfile
      parameters:
        - name: applicationProfileId
          in: path
          description: Identifier for the Application Profile
          required: true
          style: simple
          explode: false
          schema:
            type: string
            format: uuid
            maxLength: 36
        - $ref: '#/components/parameters/x-correlator'
      responses:
        '204':
          description: Application profile has been deleted successfully.
          headers:
            x-correlator:
              $ref: '#/components/headers/x-correlator'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '401':
          $ref: '#/components/responses/Unauthenticated401'
        '403':
          $ref: '#/components/responses/PermissionDenied403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '429':
          $ref: '#/components/responses/TooManyRequests429'
components:
  securitySchemes:
    openId:
      type: openIdConnect
      openIdConnectUrl: https://example.com/.well-known/openid-configuration
      description: OpenID Connect authentication via discovery metadata.
  schemas:
    Duration:
      description: A duration value with a numeric amount and a time unit.
      type: object
      properties:
        value:
          type: integer
          description: Numeric amount of the duration.
          example: 12
          format: int32
          minimum: 1
          maximum: 999
        unit:
          description: Time unit for the duration value.
          allOf:
            - $ref: '#/components/schemas/TimeUnitEnum'
            - example: Minutes
    TimeUnitEnum:
      description: Unit of time for duration values.
      type: string
      enum:
        - Days
        - Hours
        - Minutes
        - Seconds
        - Milliseconds
        - Microseconds
        - Nanoseconds
    Rate:
      description: A data rate value with a numeric amount and a unit.
      type: object
      properties:
        value:
          type: integer
          description: Numeric amount of the data rate.
          example: 10
          format: int32
          minimum: 0
          maximum: 1024
        unit:
          $ref: '#/components/schemas/RateUnitEnum'
    RateUnitEnum:
      description: |
        Unit of measurement for data rate values, in bits per second with SI
        decimal prefixes (kbps = 10^3 bps, Mbps = 10^6 bps, Gbps = 10^9 bps,
        Tbps = 10^12 bps).
      type: string
      enum:
        - bps
        - kbps
        - Mbps
        - Gbps
        - Tbps
    Compute:
      description: A memory or storage size value with a numeric amount and a unit.
      type: object
      properties:
        value:
          type: integer
          description: Numeric amount of the memory or storage size.
          example: 10
          format: int32
          minimum: 0
          maximum: 1024
        unit:
          $ref: '#/components/schemas/ComputeUnitEnum'
    ComputeUnitEnum:
      description: |
        Unit of measurement for memory and storage size values, in bytes with
        SI decimal prefixes (MB = 10^6 bytes, GB = 10^9 bytes, TB = 10^12 bytes).
      type: string
      enum:
        - MB
        - GB
        - TB
    PacketDelayBudget:
      description: |
        The packet delay budget is the maximum allowable one-way latency
        between the customer's device and the gateway from the operator's
        network to other networks. By limiting the delay, the network
        can provide an acceptable level of performance for various services,
        such as voice calls, video streaming, and data. The end-to-end or
        round trip latency will be about two times this value plus the latency
        not controlled by the operator
      allOf:
        - $ref: '#/components/schemas/Duration'
    PacketErrorLossRate:
      type: integer
      description: |-
        The exponential power of the allowable error loss rate 10^(-N). For instance 3 would be an error loss rate of 10 to the power of -3 (0.001)
        For 5G network the 3GPP specification TS 23.203 defines the packet error loss rate QCI attribute. It describes the Quality of Service (QoS) Class Identifier (QCI) parameters used to differentiate traffic classes in mobile networks, ensuring appropriate resource allocation and performance for various services.
        The packet error loss rate is one of the QCI attributes, providing information on the acceptable packet loss rate for a specific traffic class. This attribute helps maintain the desired performance level for services like voice calls, video streaming, or data transfers within the 3GPP mobile network.
      format: int32
      minimum: 1
      maximum: 10
      example: 3
    Jitter:
      description: The jitter requirement aims to limit the maximum variation in round-trip packet delay for the 99th percentile of traffic, following ITU Y.1540 standards. It considers only acknowledged packets in a session, which are packets that receive a confirmation of receipt from the recipient (e.g., using TCP). This requirement helps maintain consistent latency, essential for real-time applications such as VoIP, video calls, and gaming.
      allOf:
        - $ref: '#/components/schemas/Duration'
    TargetMinDownstreamRate:
      description: |
        This is the target minimum downstream rate.
      allOf:
        - $ref: '#/components/schemas/Rate'
    TargetMinUpstreamRate:
      description: |
        This is the target minimum upstream rate.
      allOf:
        - $ref: '#/components/schemas/Rate'
    TargetMinCpu:
      type: number
      description: Number of vCPUs required for the application. Fractional values are allowed (e.g., 0.5 = half a vCPU). The value represents the minimum amount of CPU resources to be allocated to the application instance.
      minimum: 0
      maximum: 1024
      example: 0.5
    TargetMinGpu:
      description: |
        This is the target minimum number of GPUs required by the application.
      type: integer
      format: int32
      minimum: 0
      maximum: 64
      example: 1
    GpuVendorType:
      type: string
      enum:
        - Nvidia
        - AMD
      description: GPU vendor name. Currently supported values are "Nvidia" or "AMD".
      example: Nvidia
    GpuModelName:
      type: string
      maxLength: 256
      pattern: ^[^\r\n]*$
      description: Model name corresponding to vendorType may include info e.g. for Nvidia, model name could be "Tesla M60", "Tesla V100" etc.
    TargetMinMemory:
      description: |
        This is the target minimum memory required by the application
      allOf:
        - $ref: '#/components/schemas/Compute'
    TargetMinEphemeralStorage:
      description: |
        This is the target minimum ephemeral storage required by the application
      allOf:
        - $ref: '#/components/schemas/Compute'
    TargetMinPersistentStorage:
      description: |
        This is the target minimum persistent storage required by the
        application
      allOf:
        - $ref: '#/components/schemas/Compute'
    ApplicationProfile:
      description: An application profile capturing network and compute resource requirements.
      type: object
      required:
        - applicationProfileId
      properties:
        applicationProfileId:
          type: string
          format: uuid
          maxLength: 36
          description: Unique identifier for the Application Profile.
        networkQualityThresholds:
          $ref: '#/components/schemas/NetworkQualityThresholds'
        computeResources:
          $ref: '#/components/schemas/ComputeResourcesThresholds'
      anyOf:
        - required:
            - networkQualityThresholds
        - required:
            - computeResources
    ApplicationProfileRequest:
      description: |
        Request body for creating or updating an Application Profile. At least
        one of `networkQualityThresholds` or `computeResources` must be
        provided. The identifier of the profile is assigned by the API
        provider on creation and is never part of the request body.
      type: object
      anyOf:
        - required:
            - networkQualityThresholds
        - required:
            - computeResources
      properties:
        networkQualityThresholds:
          $ref: '#/components/schemas/NetworkQualityThresholds'
        computeResources:
          $ref: '#/components/schemas/ComputeResourcesThresholds'
    NetworkQualityThresholds:
      description: Network quality thresholds for an application profile.
      type: object
      properties:
        packetDelayBudget:
          $ref: '#/components/schemas/PacketDelayBudget'
        targetMinDownstreamRate:
          $ref: '#/components/schemas/TargetMinDownstreamRate'
        targetMinUpstreamRate:
          $ref: '#/components/schemas/TargetMinUpstreamRate'
        packetLossErrorRate:
          $ref: '#/components/schemas/PacketErrorLossRate'
        jitter:
          $ref: '#/components/schemas/Jitter'
      minProperties: 1
    ComputeResourcesThresholds:
      description: Compute resources of an Application Profile.
      type: object
      properties:
        targetMinCPU:
          $ref: '#/components/schemas/TargetMinCpu'
        targetMinMemory:
          $ref: '#/components/schemas/TargetMinMemory'
        gpuVendorType:
          $ref: '#/components/schemas/GpuVendorType'
        gpuModelName:
          $ref: '#/components/schemas/GpuModelName'
        targetMinGPU:
          $ref: '#/components/schemas/TargetMinGpu'
        targetMinGPUMemory:
          $ref: '#/components/schemas/TargetMinMemory'
        targetMinEphemeralStorage:
          $ref: '#/components/schemas/TargetMinEphemeralStorage'
        targetMinPersistentStorage:
          $ref: '#/components/schemas/TargetMinPersistentStorage'
      minProperties: 1
    XCorrelator:
      type: string
      description: Correlator string, UUID format recommended but any string matching the pattern can be used
      pattern: ^[a-zA-Z0-9-_:;.\/<>{}]{0,256}$
      maxLength: 256
      example: b4333c46-49c0-4f62-80d7-f0ef930f1c46
    ErrorInfo:
      type: object
      description: A structured error response providing details about a failed request, including the HTTP status code, an error code, and a human-readable message
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: HTTP response status code
        code:
          type: string
          maxLength: 96
          description: A human-readable code to describe the error
        message:
          type: string
          maxLength: 512
          description: A human-readable description of what the event represents
  parameters:
    x-correlator:
      name: x-correlator
      in: header
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  headers:
    x-correlator:
      description: Correlation id for the different services
      schema:
        $ref: '#/components/schemas/XCorrelator'
  examples:
    GENERIC_400_INVALID_ARGUMENT:
      description: Invalid Argument. Generic Syntax Exception
      value:
        status: 400
        code: INVALID_ARGUMENT
        message: Client specified an invalid argument, request body or query param.
    GENERIC_401_UNAUTHENTICATED:
      description: Request cannot be authenticated and a new authentication is required
      value:
        status: 401
        code: UNAUTHENTICATED
        message: Request not authenticated due to missing, invalid, or expired credentials. A new authentication is required.
    GENERIC_403_PERMISSION_DENIED:
      description: Permission denied. OAuth2 token access does not have the required scope or when the user fails operational security
      value:
        status: 403
        code: PERMISSION_DENIED
        message: Client does not have sufficient permissions to perform this action.
    GENERIC_429_TOO_MANY_REQUESTS:
      description: Access to the API has been temporarily blocked due to rate or spike arrest limits being reached
      value:
        status: 429
        code: TOO_MANY_REQUESTS
        message: Rate limit reached.
    GENERIC_404_NOT_FOUND:
      description: Resource is not found
      value:
        status: 404
        code: NOT_FOUND
        message: The specified resource is not found.
  responses:
    BadRequest400:
      description: Bad Request
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              $ref: '#/components/examples/GENERIC_400_INVALID_ARGUMENT'
    Unauthenticated401:
      description: Unauthorized
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 401
                  code:
                    enum:
                      - UNAUTHENTICATED
          examples:
            GENERIC_401_UNAUTHENTICATED:
              $ref: '#/components/examples/GENERIC_401_UNAUTHENTICATED'
    PermissionDenied403:
      description: Forbidden
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 403
                  code:
                    enum:
                      - PERMISSION_DENIED
          examples:
            GENERIC_403_PERMISSION_DENIED:
              $ref: '#/components/examples/GENERIC_403_PERMISSION_DENIED'
    TooManyRequests429:
      description: Too Many Requests
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 429
                  code:
                    enum:
                      - TOO_MANY_REQUESTS
          examples:
            GENERIC_429_TOO_MANY_REQUESTS:
              $ref: '#/components/examples/GENERIC_429_TOO_MANY_REQUESTS'
    NotFound404:
      description: Not found
      headers:
        x-correlator:
          $ref: '#/components/headers/x-correlator'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorInfo'
              - type: object
                properties:
                  status:
                    enum:
                      - 404
                  code:
                    enum:
                      - NOT_FOUND
          examples:
            GENERIC_404_NOT_FOUND:
              $ref: '#/components/examples/GENERIC_404_NOT_FOUND'
