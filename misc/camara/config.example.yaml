# open5gs-camara gateway configuration.
# setup.sh copies this to config.yaml (git-ignored) and fills in random secrets.

listen:
  host: 0.0.0.0        # must be reachable from the UE data path (10.45.0.1) for Number Verification
  port: 8090

# Home PLMN of the lab subscribers (MCC+MNC, no separator)
home_plmn: "99970"

mongo:
  uri: mongodb://localhost:27017
  db: open5gs

# 5GC SBI endpoints (h2c, prior knowledge). Addresses match install/etc/open5gs/*.yaml.
sbi:
  nrf: http://127.0.0.10:7777
  bsf: http://127.0.0.15:7777
  pcf: http://127.0.0.13:7777
  udm: http://127.0.0.12:7777
  timeout: 3.0

# Open5GS metrics-port JSON/Prometheus endpoints (plain HTTP/1.1)
info:
  smf: http://127.0.0.4:9090      # /pdu-info
  amf: http://127.0.0.5:9090      # /ue-info
  upf: http://127.0.0.7:9090      # /metrics
  timeout: 3.0

auth:
  issuer: open5gs-camara
  signing_key: CHANGE_ME          # HS256 secret; setup.sh generates one
  token_ttl: 3600
  nv_token_ttl: 300         # Number Verification: <= 300 s, single use, no refresh
  code_ttl: 60              # authorization code lifetime
  clients:
    - client_id: demo-app
      client_secret: CHANGE_ME    # setup.sh generates one
      scopes:
        - "lab:read"
        - "qos-profiles:read"
        - "quality-on-demand:sessions:create"
        - "quality-on-demand:sessions:read"
        - "quality-on-demand:sessions:update"
        - "quality-on-demand:sessions:delete"
        - "quality-on-demand:sessions:retrieve-by-device"
        - "sim-swap:retrieve-date"
        - "sim-swap:check"
        - "device-swap:retrieve-date"
        - "device-swap:check"
        - "sim-swap-subscriptions:org.camaraproject.sim-swap-subscriptions.v0.swapped:create"
        - "sim-swap-subscriptions:read"
        - "sim-swap-subscriptions:delete"
        - "openid"
        - "number-verification:verify"
        - "number-verification:device-phone-number:read"
        - "lab:write"
        - "device-roaming-status:read"
        - "device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-status:create"
        - "device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-on:create"
        - "device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-off:create"
        - "device-roaming-status-subscriptions:org.camaraproject.device-roaming-status-subscriptions.v0.roaming-change-country:create"
        - "device-roaming-status-subscriptions:read"
        - "device-roaming-status-subscriptions:delete"
        - "application-profiles:create"
        - "application-profiles:read"
        - "application-profiles:update"
        - "application-profiles:delete"
        - "connectivity-insights:check"
      # authorization-code flow (Number Verification); the demo reads the code from the Location header
      redirect_uris:
        - "https://demo-app.example/callback"

notify:
  allow_http_sink: true     # lab deviation: CAMARA mandates https sinks
  timeout: 5.0
  retries: 3

qod:
  callback_base: http://127.0.0.1:8090   # PCF -> gateway termination callbacks (h2c)
  verify_timeout: 10.0                   # wait for the dedicated QoS flow in SMF /pdu-info
  expiry_interval: 1.0
  af_app_id: camara-qod

swap:
  enabled: true
  poll_interval: 2.0        # seconds between subscriber snapshots (swap detection granularity)

roaming:
  enabled: true
  poll_interval: 2.0        # AMF /ue-info polling for roaming change detection

ci:                         # Connectivity Insights probes (towards the UE via ogstun)
  ping_count: 20
  ping_interval: 0.2        # seconds; 0.2 is the non-root minimum
  iperf_enabled: false      # true needs iperf3 on this VM and `iperf3 -s` on the UE host
  iperf_port: 5201
  iperf_seconds: 3

# Lab-only helper endpoints under /_lab (resolver checks, overrides). Disable for anything but the lab.
lab_endpoints: true
